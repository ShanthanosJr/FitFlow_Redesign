version: "3.9"

# ── FitFlow local development stack ───────────────────────────────────────────
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Stream logs
#   docker compose down -v        # Stop and remove volumes

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitflow_dev
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitflow -d fitflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://fitflow:fitflow_dev_password@postgres:5432/fitflow_dev
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: dev-secret-change-in-production
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-us-east-1_placeholder}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-placeholder}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src   # hot-reload in dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── FastAPI AI Service ─────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fitflow:fitflow_dev_password@postgres:5432/fitflow_dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-fitflow-media-dev}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health').raise_for_status()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: fitflow-network
